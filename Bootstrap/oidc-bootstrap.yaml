Parameters:
  GitHubOrg:
    Type: String
  GitHubRepo:
    Type: String
  # Add this parameter to point to the existing provider
  OidcProviderArn:
    Type: String
    Description: ARN of the existing GitHub OIDC Provider

Resources:
  GithubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "GitHubActions-ECS-Dev-Role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              # Reference the existing ARN instead of creating a new resource
              Federated: !Ref OidcProviderArn
            Action: "sts:AssumeRoleWithWebIdentity"
            Condition:
              StringLike:
                "token.actions.githubusercontent.com:sub": !Sub "repo:${GitHubOrg}/${GitHubRepo}:*"
      Policies:
        - PolicyName: GitHubActionsDevAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "cloudformation:*"
                  - "s3:*"
                  - "ecr:*"
                  - "ecs:*"
                  - "ec2:*"
                  - "iam:PassRole"
                  - "iam:GetRole"
                  - "iam:PutRolePolicy"
                  - "lambda:*"
                Resource: "*"